name: Spelling
run-name: ${{ inputs.sync_run_id && format('Upstream sync {0}', inputs.sync_run_id) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sync_run_id:
        description: "Correlation ID for upstream sync verification"
        type: string
        default: ""

env:
  CLICOLOR: 1

jobs:
  spelling:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Actions Repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Spell Check Repo
      uses: crate-ci/typos@v1.49.0
