name: Upstream Sync

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC / 11:00 Asia/Shanghai.
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prepare a report without publishing a branch or PR"
        type: boolean
        default: true
      auto_merge:
        description: "Merge a clean sync PR after pinned CI passes"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  BASE_BRANCH: master
  SYNC_BRANCH: codex/upstream-sync

jobs:
  prepare:
    name: Normalize and prepare upstream merge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.prepare.outputs.status }}
      base: ${{ steps.prepare.outputs.base }}
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Test the merge engine and publication guards
        run: python3 -m unittest discover -s .github/sync -p 'test_*.py' -v
      - name: Fetch the configured upstream
        run: |
          git fetch --no-tags https://github.com/Pumpkin-MC/Pumpkin.git \
            master:refs/remotes/upstream/master
      - name: Prepare an audited merge and workspace lockfile
        id: prepare
        env:
          PREPARE_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.sha || format('origin/{0}', env.BASE_BRANCH) }}
        # Candidate manifests run only in this read-only job, without a
        # publication token or a write-permission checkout.
        run: |
          python3 .github/sync/upstream_sync.py \
            --head "$PREPARE_HEAD" --upstream upstream/master \
            --format-rust --refresh-lock --bundle --output "$RUNNER_TEMP/upstream-sync"
      - name: Preserve report, conflict patch, or candidate bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-sync-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/upstream-sync/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish PR, verify pinned CI, and merge
    needs: prepare
    if: ${{ needs.prepare.outputs.status == 'ready' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 220
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AUTO_MERGE: ${{ vars.UPSTREAM_AUTO_MERGE != 'false' && (github.event_name != 'workflow_dispatch' || inputs.auto_merge) }}
    steps:
      # Execute the trusted workflow's scripts, never candidate code, with
      # publication permissions.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: upstream-sync-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/upstream-sync/
      - name: Publish and verify the exact candidate
        env:
          SYNC_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 .github/sync/publish_sync.py \
            --report "$RUNNER_TEMP/upstream-sync/report.json" \
            --bundle "$RUNNER_TEMP/upstream-sync/candidate.bundle" \
            --output "$RUNNER_TEMP/upstream-sync-publication" \
            --base-branch "$BASE_BRANCH" --branch "$SYNC_BRANCH" \
            --run-id "$SYNC_RUN_ID" --auto-merge "$AUTO_MERGE"
      - name: Preserve CI run IDs and publication outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-sync-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/upstream-sync-publication/
          if-no-files-found: warn
          retention-days: 14
