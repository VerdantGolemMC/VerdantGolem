[package]
name = "verdantgolem-plugin-utils"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Utilities for VerdantGolem plugins: licensing, lease caching, and update checks."

[dependencies]
verdantgolem-plugin-api = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true, features = ["json"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
